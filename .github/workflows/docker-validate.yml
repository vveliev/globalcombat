name: docker validate

# Catches broken compose interpolation and prod image builds before deploy.
# Nothing is pushed.

on:
  push:
    branches: [main]
    paths:
      - "docker-compose*.yml"
      - "**/Dockerfile*"
      - ".dockerignore"
      - ".github/workflows/docker-validate.yml"
  pull_request:
    paths:
      - "docker-compose*.yml"
      - "**/Dockerfile*"
      - ".dockerignore"
      - ".github/workflows/docker-validate.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Validate the prod compose file (dummy values for the required vars)
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          DATABASE_URL: ecto://ci:ci@postgres/ci
          SECRET_KEY_BASE: ci
          PHX_HOST: example.test
          PROXY_NETWORK: ci-proxy
        run: docker compose -f docker-compose.prod.yml config --quiet

      - name: Build the prod web image (not pushed)
        run: docker build -f liveview/Dockerfile.prod liveview

      - name: Build the prod gRPC host image (not pushed)
        run: docker build -f GlobalCombat.GrpcHost/Dockerfile.prod .
