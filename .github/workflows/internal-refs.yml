# Refuse to publish internal references to a public repository.
#
# This fork is PUBLIC. Internal tracker ids, an agent identity on an internal
# email domain, and operational notes reached its history before this gate
# existed. This job is the mechanical gate that stops it recurring — it runs on
# every push and PR regardless of who or what authored the commit, which is the
# only reason it also covers commits pushed by automated agents.
#
# Matching is by shape, never by name: a denylist enumerating internal company
# names, committed to a public repo, would publish the inventory it protects.
# Literal names live in a private wordlist outside the tree.

name: internal-refs

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          # Full history: the scan reads commit messages, not just the tree.
          fetch-depth: 0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
      # PR titles and bodies reach the public repo without ever touching git
      # content, so the commit scan cannot see them. Agents open PRs with `gh`,
      # which makes this the gap that mattered most to close.
      #
      # The text is passed through `env`, never interpolated into `run`: a PR
      # body is attacker-controlled, and `${{ ... }}` inside a shell script is
      # a command-injection sink.
      - name: Scan pull request title and body
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          node scripts/check-internal-refs.mjs --text PR_TITLE
          node scripts/check-internal-refs.mjs --text PR_BODY

      - name: Scan changed content for internal references
        run: |
          BASE="${{ github.event.pull_request.base.sha || github.event.before }}"
          # A newly pushed branch reports an all-zero "before". Scanning from
          # the root commit would then re-flag every pre-existing reference and
          # fail on day one, so fall back to the merge-base with the default
          # branch: what this branch ADDS is the thing being published.
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            git fetch --no-tags origin "${{ github.event.repository.default_branch }}" || true
            BASE="$(git merge-base HEAD FETCH_HEAD 2>/dev/null || git rev-list --max-parents=0 HEAD | tail -1)"
          fi
          echo "scanning $BASE..HEAD"
          node scripts/check-internal-refs.mjs --range "$BASE..HEAD"
