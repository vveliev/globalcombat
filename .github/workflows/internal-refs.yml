# Refuse to publish internal references to a public repository.
#
# This fork is PUBLIC. Internal tracker ids, an agent identity on an internal
# email domain, and operational notes reached its history before this gate
# existed. This job is the mechanical gate that stops it recurring — it runs on
# every push and PR regardless of who or what authored the commit, which is the
# only reason it also covers commits pushed by automated agents.
#
# Matching is by shape, never by name: a denylist enumerating internal company
# names, committed to a public repo, would publish the inventory it protects.
# Literal names live in a private wordlist outside the tree.

name: internal-refs

on:
  pull_request:
    # `edited` is not in the default set, and a title or body rewritten after
    # opening is published just the same.
    types: [opened, synchronize, reopened, edited]
  # Every branch, not just main: a branch on a public fork is published the
  # moment it is pushed, whether or not a PR ever follows.
  push:
    branches: ["**"]

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    # A branch deletion publishes nothing (and has no commit to check out).
    if: github.event.deleted != true
    # Everything event-derived enters through env, never through ${{ }} inside
    # `run`: PR title/body are attacker-controlled, and even owner-controlled
    # values like a branch name are legal shell metacharacters.
    env:
      BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
      BRANCH_NAME: ${{ github.head_ref || github.ref_name }}
      PR_TITLE: ${{ github.event.pull_request.title }}
      PR_BODY: ${{ github.event.pull_request.body }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          # Full history: the scan reads commit messages, not just the tree.
          fetch-depth: 0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22

      - name: Self-test the scanner
        run: node --test scripts/check-internal-refs.test.mjs

      - name: Scan pull request title and body
        if: github.event_name == 'pull_request'
        run: |
          node scripts/check-internal-refs.mjs --text PR_TITLE
          node scripts/check-internal-refs.mjs --text PR_BODY

      # A brand-new branch reports an all-zero base, and the first push after a
      # history rewrite reports a base this clone never fetched. The scanner
      # then treats every remote branch EXCEPT the pushed one as already
      # published and scans each commit of HEAD that none of them contains —
      # what the push ADDS, never the whole history. (The old fallback, the
      # merge-base with origin/<default>, is HEAD itself when the default
      # branch is the one rewritten: an empty range that reported "clean".)
      # Every branch is fetched explicitly to keep that set complete; a failed
      # fetch only shrinks it, which scans more, never less.
      - name: Scan changed content, commit messages, and branch name
        run: |
          git fetch --no-tags --quiet origin '+refs/heads/*:refs/remotes/origin/*' || true
          node scripts/check-internal-refs.mjs \
            --range "$BASE_SHA..HEAD" \
            --published-remote origin \
            --branch "$BRANCH_NAME"
