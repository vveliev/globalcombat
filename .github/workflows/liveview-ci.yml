name: liveview CI

on:
  push:
    branches: [main]
    paths:
      - "liveview/**"
      - ".github/workflows/liveview-ci.yml"
  pull_request:
    paths:
      - "liveview/**"
      - ".github/workflows/liveview-ci.yml"

# No secrets are used and nothing is published; checkout is all this needs.
permissions:
  contents: read

defaults:
  run:
    working-directory: liveview

env:
  MIX_ENV: test

jobs:
  ci:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          # host 11434 matches config/test.exs's PGPORT default (fleet's 11400 port block)
          - 11434:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - id: versions
        run: |
          echo "otp=$(grep '^erlang ' .tool-versions | cut -d' ' -f2)" >> "$GITHUB_OUTPUT"
          echo "elixir=$(grep '^elixir ' .tool-versions | cut -d' ' -f2)" >> "$GITHUB_OUTPUT"

      - uses: erlef/setup-beam@v1
        with:
          otp-version: ${{ steps.versions.outputs.otp }}
          elixir-version: ${{ steps.versions.outputs.elixir }}

      - name: Restore deps and _build cache
        uses: actions/cache@v4
        with:
          path: |
            liveview/deps
            liveview/_build
          key: ${{ runner.os }}-mix-${{ steps.versions.outputs.otp }}-${{ steps.versions.outputs.elixir }}-${{ hashFiles('liveview/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-${{ steps.versions.outputs.otp }}-${{ steps.versions.outputs.elixir }}-

      - name: Install dependencies
        run: mix deps.get

      - name: Check formatting
        run: mix format --check-formatted

      - name: Compile (warnings as errors)
        run: mix compile --warnings-as-errors

      - name: Wait for Postgres
        run: |
          for i in $(seq 1 30); do
            pg_isready -h 127.0.0.1 -p 11434 -U postgres -q && break
            sleep 2
          done

      - name: Create and migrate test database
        run: |
          mix ecto.create --quiet
          mix ecto.migrate --quiet

      - name: Run tests with coverage
        run: mix coveralls.json

      - name: Build assets
        run: mix assets.build
