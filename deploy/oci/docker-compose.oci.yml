# Oracle Cloud (OCI) Always Free overlay for docker-compose.prod.yml.
#
# docker-compose.prod.yml expects an existing reverse proxy on an external
# network. On a single OCI Ampere A1 VM there is none, so this overlay adds
# Caddy as that proxy: it terminates TLS (Let's Encrypt, automatic renewal)
# and is the only container that publishes host ports. MySQL and the gRPC
# engine host stay on the private gc-internal network.
#
# Run from the repo root (paths below resolve against it):
#   docker compose -f docker-compose.prod.yml -f deploy/oci/docker-compose.oci.yml run --rm migrate
#   docker compose -f docker-compose.prod.yml -f deploy/oci/docker-compose.oci.yml up -d --build
#
# Requires in .env: PROXY_NETWORK=gc-proxy, ACME_EMAIL, PHX_HOST (see
# deploy/oci/env.oci.example). The gc-proxy network is created once by
# cloud-init.yaml (`docker network create gc-proxy`).

services:
  caddy:
    image: caddy:2.8.4
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      PHX_HOST: ${PHX_HOST:?PHX_HOST is required}
      ACME_EMAIL: ${ACME_EMAIL:?ACME_EMAIL is required for Let's Encrypt}
    volumes:
      - ./deploy/oci/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - web
    networks: [gc-proxy]

  # Ampere A1 has 24 GB on the free shape; these caps keep one runaway
  # container from starving the others (and the SSH session you'd fix it from).
  mysql:
    mem_limit: 4g
  web:
    mem_limit: 4g
  grpc-host:
    mem_limit: 2g

volumes:
  caddy-data:
  caddy-config:
