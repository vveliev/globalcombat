# Local development stack for the Global Combat port.
#
# Ports and the network subnet are allocated in the fleet's private port registry
# so nothing here collides with another
# project running at the same time. This project owns block 11400:
#
#   11400  Phoenix / LiveView web        (+00)
#   11402  Phoenix test endpoint         (+02)
#   11410  .NET gRPC engine host         (+10)  — reserved, added by the gRPC spike
#   11434  Postgres                      (+34)
#
# The subnet follows 10.<block/100>.0.0/24, which keeps us out of Docker's
# default 172.16/12 pool entirely — that pool hands out /16s in allocation
# order, so an unpinned project can silently take a range we depend on.

# Pinned so every checkout (main, worktrees, CI) shares one compose project: the
# 10.114.0.0/24 subnet below can only exist once per Docker host, so a second
# project name from a different directory fails with "Pool overlaps with other one".
# The flip side: only one checkout's stack can be up at a time — `docker compose up`
# from another clone/worktree recreates these same containers against its own
# bind mounts (same DB volume, same ports) instead of starting a second stack.
name: globalcombat

services:
  postgres:
    image: postgres:18
    environment:
      # Dev-only credentials; the port mapping below keeps this on loopback.
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      # Bound to loopback: this is a dev database, not a service on the LAN.
      # 11434 keeps the slot the registry already reserves for this project's DB.
      - "127.0.0.1:11434:5432"
    volumes:
      # Postgres 18+ images keep data in a versioned subdirectory
      # (/var/lib/postgresql/18/docker), so the volume mounts the parent; mounting
      # the old /var/lib/postgresql/data path makes the 18 image refuse to start.
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [gc]

  web:
    build:
      context: ./liveview
      dockerfile: Dockerfile.dev
    environment:
      PGHOST: postgres
      PGPORT: "5432"
      # The .NET engine (only with `--profile engine`), reached by service name
      # on the container port. The 11410 mapping below is for reaching it from
      # the host, not from here. The app itself never calls it.
      GRPC_HOST: grpc-host
      GRPC_PORT: "5251"
      # Binds 0.0.0.0 inside the container; the port mapping below is what
      # actually keeps this off the LAN, same guarantee as running natively.
      PHX_BIND: "all"
    ports:
      - "127.0.0.1:11400:11400"
    volumes:
      - ./liveview:/app
      # Anonymous volumes: deps/_build are compiled for Linux inside the
      # container and must not be shadowed by macOS-host artifacts from the
      # bind mount above.
      - /app/deps
      - /app/_build
    depends_on:
      postgres:
        condition: service_healthy
    networks: [gc]

  # The .NET engine from the gRPC spike, serving GlobalCombat.Core over gRPC.
  # Plaintext HTTP/2 (h2c, no TLS) -- fine inside the compose network for a
  # spike, not a production posture.
  #
  # Not part of the default stack: the web app resolves turns with the Elixir
  # engine (GlobalCombat.Engine.Game) and never calls this. It exists for the
  # differential harness, which compares the two engines turn by turn:
  #
  #   docker compose --profile engine up -d grpc-host
  #   docker compose run --rm web mix game_engine.diff_harness --turns 50 --seed 42
  grpc-host:
    profiles: [engine]
    build:
      context: .
      dockerfile: GlobalCombat.GrpcHost/Dockerfile
    ports:
      # 11410 is this project's reserved slot for the engine host in the fleet
      # port registry (see the header). The spike used a bare 5251, which would
      # collide with any other project doing the same; the container port stays
      # 5251 because that is what the host listens on.
      - "127.0.0.1:11410:5251"
    networks: [gc]

volumes:
  postgres-data:

networks:
  gc:
    ipam:
      config:
        - subnet: 10.114.0.0/24
