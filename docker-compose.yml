# Local development stack for the Global Combat port.
#
# Ports and the network subnet are allocated in the fleet registry
# (vveliev/skynet, registry/PORTS.md) so nothing here collides with another
# project running at the same time. This project owns block 11400:
#
#   11400  Phoenix / LiveView web        (+00)
#   11402  Phoenix test endpoint         (+02)
#   11410  .NET gRPC engine host         (+10)  — reserved, added by GIF-38
#   11434  MySQL                         (+34)
#
# The subnet follows 10.<block/100>.0.0/24, which keeps us out of Docker's
# default 172.16/12 pool entirely — that pool hands out /16s in allocation
# order, so an unpinned project can silently take a range we depend on.

# Pinned so every checkout (main, worktrees, CI) shares one compose project: the
# 10.114.0.0/24 subnet below can only exist once per Docker host, so a second
# project name from a different directory fails with "Pool overlaps with other one".
# The flip side: only one checkout's stack can be up at a time — `docker compose up`
# from another clone/worktree recreates these same containers against its own
# bind mounts (same DB volume, same ports) instead of starting a second stack.
name: globalcombat

services:
  mysql:
    image: mysql:8.0
    # MySQL 8's default caching_sha2_password closes the socket on MyXQL's
    # empty-password root connection. The failure surfaces as an unexplained
    # "socket closed", not an auth error, so it is pinned here deliberately.
    command: --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
    ports:
      # Bound to loopback: this is a dev database, not a service on the LAN.
      - "127.0.0.1:11434:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      # The two schemas checked into the repo. DDL only — there is no data
      # dump, so this gives you empty tables of the right shape, nothing more.
      - ./globalcombat MySql Schema.sql:/docker-entrypoint-initdb.d/10-globalcombat.sql:ro
      - ./gc_games MySql Schema.sql:/docker-entrypoint-initdb.d/20-gc_games.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-uroot"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [gc]

  web:
    build:
      context: ./liveview
      dockerfile: Dockerfile.dev
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: "3306"
      # The .NET engine, reached by service name on the container port. The
      # 11410 mapping below is for reaching it from the host, not from here.
      GRPC_HOST: grpc-host
      GRPC_PORT: "5251"
      # Binds 0.0.0.0 inside the container; the port mapping below is what
      # actually keeps this off the LAN, same guarantee as running natively.
      PHX_BIND: "all"
    ports:
      - "127.0.0.1:11400:11400"
    volumes:
      - ./liveview:/app
      # Anonymous volumes: deps/_build are compiled for Linux inside the
      # container and must not be shadowed by macOS-host artifacts from the
      # bind mount above.
      - /app/deps
      - /app/_build
    depends_on:
      mysql:
        condition: service_healthy
      grpc-host:
        condition: service_started
    networks: [gc]

  # The .NET engine from GIF-38's spike, serving GlobalCombat.Core over gRPC.
  # Plaintext HTTP/2 (h2c, no TLS) -- fine inside the compose network for a
  # spike, not a production posture.
  #
  #   docker compose up -d grpc-host
  #   docker compose run --rm web mix game_engine.resolve_turn
  grpc-host:
    build:
      context: .
      dockerfile: GlobalCombat.GrpcHost/Dockerfile
    ports:
      # 11410 is this project's reserved slot for the engine host in the fleet
      # port registry (see the header). The spike used a bare 5251, which would
      # collide with any other project doing the same; the container port stays
      # 5251 because that is what the host listens on.
      - "127.0.0.1:11410:5251"
    networks: [gc]

volumes:
  mysql-data:

networks:
  gc:
    ipam:
      config:
        - subnet: 10.114.0.0/24
