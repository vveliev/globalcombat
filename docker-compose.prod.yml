# Production stack without Kamal: the same release image on any Docker host.
# The launch deploy uses Kamal instead (config/deploy.yml, docs/adr/0004).
#
# Needs a `.env` from .env.production.example, and an existing reverse proxy
# that terminates TLS on the external network named by PROXY_NETWORK.
#
# Migrations run as a one-shot step before `web` starts:
#   docker compose -f docker-compose.prod.yml run --rm migrate
#   docker compose -f docker-compose.prod.yml up -d

services:
  postgres:
    image: postgres:18
    # POSTGRES_USER owns POSTGRES_DB and is the role the app connects as.
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-global_combat_prod}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      # See docker-compose.yml: 18+ images keep data under /var/lib/postgresql/18/docker.
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
    networks: [gc-internal]

  migrate:
    build:
      context: ./liveview
      dockerfile: Dockerfile.prod
    entrypoint: ["/app/bin/migrate"]
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
    depends_on:
      postgres:
        condition: service_healthy
    networks: [gc-internal]

  web:
    build:
      context: ./liveview
      dockerfile: Dockerfile.prod
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      SECRET_KEY_BASE: ${SECRET_KEY_BASE:?SECRET_KEY_BASE is required}
      PHX_HOST: ${PHX_HOST:?PHX_HOST is required}
      PHX_SERVER: "true"
      PORT: "4000"
      MAILGUN_API_KEY: ${MAILGUN_API_KEY:-}
      MAILGUN_DOMAIN: ${MAILGUN_DOMAIN:-}
      MAILER_FROM: ${MAILER_FROM:-}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks: [gc-internal, gc-proxy]

volumes:
  postgres-data:

networks:
  gc-internal: {}
  # Owned by the reverse proxy; this file doesn't create it.
  gc-proxy:
    external: true
    name: ${PROXY_NETWORK:?PROXY_NETWORK is required — the reverse proxy's Docker network}
